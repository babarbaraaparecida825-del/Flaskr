{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 mb-0">{% block title %}Novo Post{% endblock %}</h1>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('index') }}">Voltar</a>
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="title" class="form-label">Título</label>
              <input type="text" name="title" id="title" class="form-control"
                     value="{{ request.form['title'] }}" required autofocus>
            </div>

            <div class="mb-3">
              <label for="body" class="form-label">Conteúdo</label>
              <textarea name="body" id="body" rows="6" class="form-control" required>{{ request.form['body'] }}</textarea>
            </div>

            <div class="mb-4">
              <label for="imagem_post" class="form-label">Imagem do Post <span class="text-muted small">(opcional)</span></label>
              <input type="file" name="imagem_post" id="imagem_post" class="form-control" accept="image/*">
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancelar</a>
              <button type="submit" class="btn btn-primary">Publicar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
